# 生产部署（步骤见 deploy/README.md）。服务器上只需要这个文件和 .env.prod：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 应用镜像由 GitHub Actions 构建并发布到 ghcr.io；数据库不对外开放。
name: chongqin_prod

services:
  app:
    image: ghcr.io/peanut2001/chongqin_admin:${APP_VERSION:-latest}
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql+psycopg://chongqin:${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}@db:5432/chongqin
    ports:
      # 默认只监听本机，由服务器上的反向代理（负责 HTTPS）转发过来
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=chongqin
      - POSTGRES_USER=chongqin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chongqin -d chongqin']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pg_data:
  uploads:
