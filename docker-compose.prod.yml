# 生产部署（步骤见 deploy/README.md）：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 只对外开放 80/443；数据库与后端只在 compose 内部网络中访问。
name: chongqin_prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 登录页「演示账号」按钮与后端演示登录开关保持一致
        VITE_SHOW_DEMO_ACCOUNTS: ${ALLOW_DEMO_LOGIN:-false}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      - SERVER_NAME=${SERVER_NAME:?请在 .env.prod 中设置 SERVER_NAME}
    volumes:
      - ${CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql+psycopg://chongqin:${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}@db:5432/chongqin
    volumes:
      - api_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=chongqin
      - POSTGRES_USER=chongqin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chongqin -d chongqin']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pg_data:
  api_uploads:
