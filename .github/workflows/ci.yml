name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    runs-on: ubuntu-latest
    # 在 Playwright 官方镜像里运行：浏览器与系统依赖已预装，不依赖 runner 系统版本。
    # 版本须与 pnpm-lock.yaml 中的 playwright 一致，升级 playwright 时一起改
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 固定 pnpm 10：与生成 pnpm-lock.yaml 的版本、Dockerfile 一致（不固定会装到最新大版本）
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build the project
        run: pnpm build
